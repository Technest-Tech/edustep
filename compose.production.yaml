name: edustep-production

x-api-common: &api-common
  image: edustep-api:${APP_VERSION:-latest}
  env_file:
    - ${PRODUCTION_ENV_FILE:-./infra/production.env}
  environment:
    APP_ENV: production
    APP_DEBUG: "false"
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: "5432"
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    CACHE_STORE: redis
    QUEUE_CONNECTION: redis
    SESSION_DRIVER: database
    BACKUP_PATH: /var/backups/edustep
  volumes:
    - app_storage:/var/www/html/storage
    - backup_data:/var/backups/edustep
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:?Set DB_DATABASE in infra/production.env}
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME in infra/production.env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in infra/production.env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - private

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in infra/production.env}
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - redis_data:/data
    networks:
      - private

  migrate:
    <<: *api-common
    build:
      context: .
      dockerfile: infra/docker/api.production.Dockerfile
    command: ["php", "artisan", "migrate", "--force", "--isolated"]
    restart: "no"
    networks:
      - private

  api:
    <<: *api-common
    build:
      context: .
      dockerfile: infra/docker/api.production.Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "php", "artisan", "operations:check", "--core", "--quiet"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - private
      - public

  queue:
    <<: *api-common
    restart: unless-stopped
    command:
      - php
      - artisan
      - queue:work
      - redis
      - --queue=critical,default,notifications,integrations
      - --sleep=2
      - --tries=3
      - --backoff=5
      - --timeout=120
      - --max-time=3600
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 2m
    networks:
      - private
      - public

  scheduler:
    <<: *api-common
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 1m
    networks:
      - private
      - public

  web:
    image: edustep-web:${APP_VERSION:-latest}
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - private
      - public

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-127.0.0.1:8081}:80"
    volumes:
      - ./infra/nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - private
      - public

volumes:
  postgres_data:
  redis_data:
  app_storage:
  backup_data:

networks:
  public:
  private:
    internal: true
