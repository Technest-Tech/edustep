name: edustep

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: edustep
      POSTGRES_USER: edustep
      POSTGRES_PASSWORD: edustep_local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edustep -d edustep"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis_data:/data

  migrate:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    command: php artisan migrate --force
    env_file:
      - apps/api/.env
    environment: &api-environment
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: edustep
      DB_USERNAME: edustep
      DB_PASSWORD: edustep_local
      REDIS_HOST: redis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      SANCTUM_STATEFUL_DOMAINS: localhost,localhost:8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    env_file:
      - apps/api/.env
    environment: *api-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  queue:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    command: php artisan queue:work --sleep=2 --tries=3 --timeout=90
    env_file:
      - apps/api/.env
    environment: *api-environment
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      api:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web

volumes:
  postgres_data:
  redis_data:

