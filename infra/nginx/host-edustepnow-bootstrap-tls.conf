# Temporary TLS bootstrap configuration for the period between a DNS provider
# migration and the first successful public certificate issuance.

server {
    listen 80;
    listen [::]:80;
    server_name edustepnow.com www.edustepnow.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://edustepnow.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name edustepnow.com www.edustepnow.com;

    ssl_certificate /etc/ssl/edustepnow.com/selfsigned.crt;
    ssl_certificate_key /etc/ssl/edustepnow.com/selfsigned.key;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
